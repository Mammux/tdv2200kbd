# OpenOCD: a Raspberry Pi 2/3/4 drives the Pico's SWD pins from its GPIO header.
#
#   Pi header pin 18 (GPIO 24)  ->  Pico SWDIO
#   Pi header pin 22 (GPIO 25)  ->  Pico SWCLK
#   Pi header pin 20 (GND)      ->  Pico GND (middle pin of the SWD header)
#
# Run on the Pi:  openocd -f pi-swd.cfg -f target/rp2040.cfg
# The pins are set here because OpenOCD's own default pins differ between
# versions (0.12.0: 11/25, later: 11/8).

source [find interface/raspberrypi2-native.cfg]
adapter gpio swclk 25
adapter gpio swdio 24
transport select swd
adapter speed 1000

# Let gdb on another computer connect (port 3333).
bindto 0.0.0.0
